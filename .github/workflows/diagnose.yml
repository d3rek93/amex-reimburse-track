name: Diagnose data

# Read-only health checks on the production database. Prints counts only —
# never amounts, labels or other personal data.
on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths: [".github/workflows/diagnose.yml"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Counts
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          q() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$1" '{query: $q}')"
          }
          note() { echo "::notice::$1: $(q "$2" | jq -c '.')"; }
          note "bank sessions per bank" "select aspsp_name, count(*) as sessions, sum(jsonb_array_length(accounts)) as accounts from bank_sessions group by 1"
          note "expenses per source and origin" "select source, split_part(coalesce(bank_transaction_id,'none'), ':', 1) ~ '^(file|manual|none)$' as from_file, count(*) from expenses group by 1, 2 order by 1, 2"
          note "duplicate expense groups (same date, amount, label)" "select count(*) as groups, coalesce(sum(n - 1), 0) as extra_rows from (select count(*) as n from expenses group by user_id, date, amount_eur, description having count(*) > 1) d"
          note "duplicates across bank accounts uid" "select count(*) as groups from (select count(distinct split_part(bank_transaction_id, ':', 1)) as accounts from expenses where bank_transaction_id not like 'file:%' and bank_transaction_id not like 'manual:%' group by user_id, date, amount_eur, description having count(distinct split_part(bank_transaction_id, ':', 1)) > 1) d"
          note "rejections" "select count(*) from reconciliation_rejections"
          note "links" "select count(*) from reconciliation_links"
          note "claim lines / batches / transfers" "select (select count(*) from claim_lines) as lines, (select count(*) from claim_batches) as batches, (select count(*) from jetfly_transfers) as transfers"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine statistics
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          mkdir -p /tmp/data
          # Exported to the runner's disk only; the script prints statistics, never rows.
          for t in expenses claim_lines reconciliation_links reconciliation_rejections jetfly_transfers; do
            curl -s -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "select coalesce(json_agg(t), '[]'::json) as j from public.$t t" '{query: $q}')" \
              | jq '.[0].j' > /tmp/data/$t.json
          done
          node --experimental-strip-types --no-warnings tests/diagnose/engine-stats.ts /tmp/data
          rm -rf /tmp/data
# rerun 1793188351
# rerun 1793189067
      - name: Bank-sync vs file duplicates
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          q() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$1" '{query: $q}')"
          }
          note() { echo "::notice::$1: $(q "$2" | jq -c '.')"; }
          note "bank-sync lines with a file twin (same source, amount, ±3 days)" "select b.source, count(distinct b.id) as bank_lines_with_twin, count(distinct f.id) as file_twins from expenses b join expenses f on f.user_id = b.user_id and f.source = b.source and f.amount_eur = b.amount_eur and abs(f.date - b.date) <= 3 and f.bank_transaction_id like 'file:%' where b.bank_transaction_id not like 'file:%' and b.bank_transaction_id not like 'manual:%' group by b.source"
          note "of which same first 6 letters of merchant" "select count(*) from expenses b join expenses f on f.user_id = b.user_id and f.source = b.source and f.amount_eur = b.amount_eur and abs(f.date - b.date) <= 3 and f.bank_transaction_id like 'file:%' where b.bank_transaction_id not like 'file:%' and b.bank_transaction_id not like 'manual:%' and left(regexp_replace(upper(b.description), '[^A-Z]', '', 'g'), 6) = left(regexp_replace(upper(f.description), '[^A-Z]', '', 'g'), 6)"
          note "transfer duplicates (same date, amount; origins)" "select count(*) as groups, sum(n) as rows, count(*) filter (where origins > 1) as mixed_origin from (select count(*) as n, count(distinct split_part(bank_transaction_id, ':', 1) = 'file') as origins from jetfly_transfers group by user_id, date, amount_eur having count(*) > 1) d"
          note "transfers by origin and month (2026-06..)" "select to_char(date, 'YYYY-MM') as m, split_part(bank_transaction_id, ':', 1) = 'file' as from_file, count(*) from jetfly_transfers where date >= '2026-06-01' group by 1, 2 order by 1, 2"
          note "date range bank-sync / files" "select source, split_part(bank_transaction_id, ':', 1) = 'file' as from_file, min(to_char(date, 'YYYY-MM')), max(to_char(date, 'YYYY-MM')) from expenses group by 1, 2 order by 1, 2"
# rerun 1793194851
# rerun 1793196749
# rerun 1793201022
# rerun 1793201067
# rerun 1793201250
      - name: Advance terms (aggregates, asked by the user)
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          mkdir -p /tmp/adv
          for t in expenses claim_lines reconciliation_links reconciliation_rejections jetfly_transfers account_snapshots; do
            curl -s -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "select coalesce(json_agg(t), '[]'::json) as j from public.$t t" '{query: $q}')" \
              | jq '.[0].j' > /tmp/adv/$t.json
          done
          node --experimental-strip-types --no-warnings tests/diagnose/advance-stats.ts /tmp/adv
          rm -rf /tmp/adv

