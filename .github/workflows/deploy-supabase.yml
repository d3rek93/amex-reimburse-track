name: Deploy Supabase

# Applies database migrations and deploys edge functions to the project
# in supabase/config.toml. Needs two repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com > Account > Access Tokens)
#   SUPABASE_DB_PASSWORD   database password chosen when the project was created

on:
  push:
    branches: [v2]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set in the repository secrets"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          supabase link --project-ref "$ref" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy functions
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          supabase functions deploy --project-ref "$ref"
