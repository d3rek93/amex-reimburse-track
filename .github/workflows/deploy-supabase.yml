name: Deploy Supabase

# Applies database migrations and deploys edge functions to the project
# in supabase/config.toml. Needs two repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com > Account > Access Tokens)
#   SUPABASE_DB_PASSWORD   database password chosen when the project was created

on:
  push:
    branches: [v2]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Public origin of the app on Render; must match the redirect URL
      # registered in the Enable Banking control panel (+ /bank-callback).
      APP_URL: https://expense-tracker-vwac.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set in the repository secrets"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          supabase link --project-ref "$ref" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy functions
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          supabase functions deploy --project-ref "$ref"

      - name: Configure app URL (auth redirects + bank callback)
        run: |
          ref=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          supabase secrets set --project-ref "$ref" "APP_URL=$APP_URL"
          code=$(curl -s -o /tmp/auth.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$ref/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$APP_URL\",\"uri_allow_list\":\"$APP_URL/**\"}")
          echo "::notice::auth config: HTTP $code"; [ "$code" = "200" ] || { cat /tmp/auth.json; exit 1; }

      - name: Verify site responds
        run: |
          for p in / /bank-callback; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL$p")
            echo "::notice::site $p: HTTP $code"; [ "$code" = "200" ] || exit 1
          done

      - name: Verify tables and functions respond
        run: |
          set -a; . ./.env; set +a
          fail=0
          for t in expenses reimbursements account_snapshots bank_sessions manual_transfers balance_references; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
              "$VITE_SUPABASE_URL/rest/v1/$t?select=id&limit=1")
            echo "::notice::table $t: HTTP $code"; [ "$code" = "200" ] || fail=1
          done
          for f in enable-banking parse-amex-pdf; do
            # No user token: a deployed function answers 401, a missing one 404.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
              "$VITE_SUPABASE_URL/functions/v1/$f")
            echo "::notice::function $f: HTTP $code"; [ "$code" != "404" ] || fail=1
          done
          exit $fail
